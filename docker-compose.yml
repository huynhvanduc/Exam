services:
  mongodb:
    container_name: mongo.db
    image: mongo
    ports:
        - '27017:27017'
    volumes:
        - mongo-data:/var/lib/mongodb/data
    networks:
        - exam
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
  sqlserver:
    container_name: sqlserver.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
        - '1433:1433'
    volumes:
        - sqlserver_data:/var/opt/mssql
    networks:
        - exam
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
  identity.server:
    container_name: identity.server
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Server/Dockerfile
    ports:
        - '5001:8080'
    volumes:
        - identity-dataprotection-keys:/app/dataprotection-keys
    networks:
        - exam
    restart: always
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentitySqlConnection: "Server=sqlserver.db,1433;Database=ExamIdentity;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      IdentityServer__SelfAuthority: "http://localhost:8080"
      # Override ClientSecret theo VỊ TRÍ trong mảng IdentityServer:Clients của appsettings.json
      # (0=exam.api.internal, 1=exam.warehouse.worker, 2=exam.tester) - đổi thứ tự client trong
      # appsettings.json thì PHẢI sửa lại index tương ứng ở đây.
      IdentityServer__Clients__0__ClientSecret: "${IDENTITY_INTERNAL_CLIENT_SECRET}"
      IdentityServer__Clients__1__ClientSecret: "${IDENTITY_WAREHOUSE_CLIENT_SECRET}"
      IdentityServer__Clients__2__ClientSecret: "${IDENTITY_TESTER_CLIENT_SECRET}"
  exam.api:
    container_name: exam.api
    build:
      context: .
      dockerfile: src/Services/Exam/Exam.API/Dockerfile
    ports:
        - '5000:8080'
    networks:
        - exam
    restart: always
    depends_on:
      - mongodb
      - identity.server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo.db:27017/?authSource=admin"
      MongoDb__DatabaseName: "ExamDb"
      IdentityServer__Authority: "http://identity.server:8080"
      IdentityServer__Audience: "exam_api"
      IdentityServer__InternalClientId: "exam.api.internal"
      IdentityServer__InternalClientSecret: "${IDENTITY_INTERNAL_CLIENT_SECRET}"
      IdentityServer__InternalScope: "identity_api.manage"
      HealthChecksUI__HealthChecks__0__Uri: "http://localhost:8080/health"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  exam.webapp:
    container_name: exam.webapp
    build:
      context: .
      dockerfile: src/Web/Exam.WebApp/Dockerfile
    ports:
        - '6004:8080'
    volumes:
        - webapp-dataprotection-keys:/app/dataprotection-keys
    networks:
        - exam
    restart: always
    depends_on:
      - exam.api
      - identity.server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      IdentityServer__Authority: "http://identity.server:8080"
      IdentityServer__PublicAuthority: "http://localhost:6004/idp"
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: "http://identity.server:8080/"
      ExamApi__BaseUrl: "http://exam.api:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
    exam:
        driver: bridge
volumes:
    mongo-data:
    sqlserver_data:
    webapp-dataprotection-keys:
    identity-dataprotection-keys:
