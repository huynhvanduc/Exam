services:
  mongodb:
    container_name: mongo.db
    image: mongo
    ports:
        - '27017:27017'
    volumes:
        - mongo-data:/var/lib/mongodb/data
    networks:
        - exam
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Admin@12345
  sqlserver:
    container_name: sqlserver.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
        - '1433:1433'
    volumes:
        - sqlserver_data:/var/opt/mssql
    networks:
        - exam
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Admin@12345
  identity.server:
    container_name: identity.server
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Server/Dockerfile
    ports:
        - '5001:8080'
    networks:
        - exam
    restart: always
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentitySqlConnection: "Server=sqlserver.db,1433;Database=ExamIdentity;User Id=sa;Password=Admin@12345;TrustServerCertificate=True;"
  exam.api:
    container_name: exam.api
    build:
      context: .
      dockerfile: src/Services/Exam/Exam.API/Dockerfile
    ports:
        - '5000:8080'
    networks:
        - exam
    restart: always
    depends_on:
      - mongodb
      - identity.server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: "mongodb://admin:Admin%4012345@mongo.db:27017/?authSource=admin"
      MongoDb__DatabaseName: "ExamDb"
      IdentityServer__Authority: "http://identity.server:8080"
      IdentityServer__Audience: "exam_api"
      HealthChecksUI__HealthChecks__0__Uri: "http://localhost:8080/health"
  exam.webapp:
    container_name: exam.webapp
    build:
      context: .
      dockerfile: src/Web/Exam.WebApp/Dockerfile
    ports:
        - '6004:8080'
    networks:
        - exam
    restart: always
    depends_on:
      - exam.api
      - identity.server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      IdentityServer__Authority: "http://identity.server:8080"
      IdentityServer__PublicAuthority: "http://localhost:5001"
      ExamApi__BaseUrl: "http://exam.api:8080"

networks:
    exam:
        driver: bridge
volumes:
    mongo-data:
    sqlserver_data:
