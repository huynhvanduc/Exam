services:
  mongodb:
    container_name: mongo.db
    image: mongo
    ports:
        - '27017:27017'
    volumes:
        - mongo-data:/var/lib/mongodb/data
    networks:
        - exam
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Admin@12345
  sqlserver:
    container_name: sqlserver.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
        - '1433:1433'
    volumes:
        - sqlserver_data:/var/opt/mssql
    networks:
        - exam
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Admin@12345

networks:
    exam:
        driver: bridge
volumes:
    mongo-data:
    sqlserver_data:
